<div style="font-family: Arial, Helvetica, sans-serif; color: #242c27; max-width: 480px; margin: 0 auto; padding: 32px 24px;">
  <p style="font-family: Georgia, 'Times New Roman', serif; font-size: 24px; margin: 0 0 24px;">Racha Store</p>
  <p style="font-size: 15px; line-height: 1.6; margin: 0 0 24px;">
    Bonjour,<br />
    Vous avez demandé à changer le mot de passe de votre compte. Ce lien est valable une heure :
  </p>
  <p style="margin: 0 0 24px;">
    <a
      href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/compte/nouveau-mot-de-passe"
      style="display: inline-block; background: #242c27; color: #faf8f3; text-decoration: none; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; padding: 14px 28px;"
      >Choisir un nouveau mot de passe</a
    >
  </p>
  <p style="font-size: 13px; line-height: 1.6; color: #8c897c; margin: 0 0 32px;">
    Si vous n'êtes pas à l'origine de cette demande, ignorez cet e-mail : votre mot de passe reste inchangé.
  </p>
  <p style="font-size: 12px; color: #8c897c; margin: 0;">Racha Store, Scat Urbain, Dakar, Sénégal</p>
</div>
